<!DOCTYPE html>
<html lang="es">
<head>
    <title>Lab 11 - WebXR AR Forzado</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            font-size: 14px;
        }
        a { color: #4af; text-decoration: none; }
        #debug-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            z-index: 200;
            border-radius: 4px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>

    <div id="info">
        <a href="https://threejs.org" target="_blank">three.js</a> WebXR AR - Modo forzado
    </div>
    <div id="debug-log">[LOG] Iniciando...<br></div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        const logEl = document.getElementById('debug-log');
        function log(msg) {
            console.log(msg);
            logEl.innerHTML += msg + '<br>';
            logEl.scrollTop = logEl.scrollHeight;
        }

        let container, camera, scene, renderer;
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let raycaster, controls, group;
        let isDepthSupplied = false;
        const intersected = [];
        const tempMatrix = new THREE.Matrix4();

        init();

        async function init() {
            try {
                log('[1] Iniciando...');

                // Verificar soporte WebXR ANTES de crear nada
                if (!navigator.xr) {
                    log('[ERROR] navigator.xr no existe. Usa Chrome.');
                    return;
                }

                const arSupported = await navigator.xr.isSessionSupported('immersive-ar');
                log('[2] AR soportado: ' + arSupported);

                if (!arSupported) {
                    log('[ERROR] Tu celular no soporta AR ahora mismo.');
                    return;
                }

                container = document.createElement('div');
                document.body.appendChild(container);

                scene = new THREE.Scene();
                scene.background = null; // Passthrough

                camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
                camera.position.set(0, 1.6, 3);

                controls = new OrbitControls(camera, container);
                controls.target.set(0, 1.6, 0);
                controls.update();

                const floorGeometry = new THREE.PlaneGeometry(6, 6);
                const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.25, blending: THREE.CustomBlending, transparent: false });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                scene.add(floor);

                scene.add(new THREE.HemisphereLight(0xbcbcbc, 0xa5a5a5, 3));

                const light = new THREE.DirectionalLight(0xffffff, 3);
                light.position.set(0, 6, 0);
                light.castShadow = true;
                light.shadow.camera.top = 3;
                light.shadow.camera.bottom = -3;
                light.shadow.camera.right = 3;
                light.shadow.camera.left = -3;
                light.shadow.mapSize.set(4096, 4096);
                scene.add(light);

                group = new THREE.Group();
                scene.add(group);

                // Material Shader
                const depthMaterial = new THREE.ShaderMaterial({
                    transparent: true,
                    side: THREE.DoubleSide,
                    uniforms: {
                        diffuseColor: { value: new THREE.Color(0x00aaff) },
                        emissive:     { value: 0.0 },
                        depthColor:   { value: null },
                        depthWidth:   { value: 1.0 },
                        depthHeight:  { value: 1.0 }
                    },
                    vertexShader: /* glsl */ `
                        varying vec3 vNormal;
                        varying vec2 vUv;
                        varying vec3 vViewPosition;
                        void main() {
                            vNormal = normalize(normalMatrix * normal);
                            vUv = uv;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            vViewPosition = -mvPosition.xyz;
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: /* glsl */ `
                        uniform vec3 diffuseColor;
                        uniform float emissive;
                        uniform sampler2DArray depthColor;
                        uniform float depthWidth;
                        uniform float depthHeight;
                        varying vec3 vNormal;
                        varying vec2 vUv;
                        varying vec3 vViewPosition;
                        #define saturate(a) clamp(a, 0.0, 1.0)
                        float Depth_GetCameraDepthInMeters(const sampler2DArray depthTexture, const vec2 depthUv, int arrayIndex) {
                            return texture(depthColor, vec3(depthUv.x, depthUv.y, arrayIndex)).r;
                        }
                        float Depth_GetOcclusion(const sampler2DArray depthTexture, const vec2 depthUv, float assetDepthM, int arrayIndex) {
                            float depthMm = Depth_GetCameraDepthInMeters(depthTexture, depthUv, arrayIndex);
                            const float kDepthTolerancePerM = 0.001;
                            return clamp(1.0 - 0.5 * (depthMm - assetDepthM) / (kDepthTolerancePerM * assetDepthM) + 0.5, 0.0, 1.0);
                        }
                        float Depth_GetBlurredOcclusionAroundUV(const sampler2DArray depthTexture, const vec2 uv, float assetDepthM, int arrayIndex) {
                            const float kKernelTotalWeights = 269.0;
                            float sum = 0.0;
                            const float kOcclusionBlurAmount = 0.0005;
                            vec2 blurriness = vec2(kOcclusionBlurAmount, kOcclusionBlurAmount);
                            float current = 0.0;
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, -2.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, -2.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, +2.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, +2.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-2.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+2.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-2.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+2.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                            sum += current * 4.0;
                            current = 0.0;
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-2.0, -0.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+2.0, +0.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+0.0, +2.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-0.0, -2.0) * blurriness, assetDepthM, arrayIndex);
                            sum += current * 7.0;
                            current = 0.0;
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                            sum += current * 16.0;
                            current = 0.0;
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+0.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-0.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, +0.0) * blurriness, assetDepthM, arrayIndex);
                            current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, -0.0) * blurriness, assetDepthM, arrayIndex);
                            sum += current * 26.0;
                            current = Depth_GetOcclusion(depthTexture, uv, assetDepthM, arrayIndex);
                            sum += current * 33.0;
                            return sum / kKernelTotalWeights;
                        }
                        void main() {
                            vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                            float lightIntensity = max(dot(vNormal, lightDir), 0.3);
                            vec3 finalColor = diffuseColor * lightIntensity;
                            finalColor += vec3(emissive * 0.2);
                            float assetDepthM = length(vViewPosition);
                            vec2 screenUV = gl_FragCoord.xy / vec2(depthWidth, depthHeight);
                            float occlusion = 1.0;
                            if (depthWidth > 1.0 && depthHeight > 1.0) {
                                occlusion = Depth_GetBlurredOcclusionAroundUV(depthColor, screenUV, assetDepthM, 0);
                            }
                            gl_FragColor = vec4(finalColor, occlusion);
                        }
                    `
                });

                const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const object = new THREE.Mesh(geometry, depthMaterial);
                object.position.set(0, 1.0, -1.5);
                object.castShadow = true;
                object.receiveShadow = true;
                group.add(object);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.xr.enabled = true;
                container.appendChild(renderer.domElement);

                // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
                //  FIX: Forzar modo AR explÃ­citamente
                // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
                const sessionInit = {
                    mode: 'immersive-ar'  // â† Esto fuerza AR, no VR
                };

                const xrButton = XRButton.createButton(renderer, sessionInit);
                document.body.appendChild(xrButton);
                log('[3] BotÃ³n AR creado (modo forzado: immersive-ar)');

                controller1 = renderer.xr.getController(0);
                controller1.addEventListener('selectstart', onSelectStart);
                controller1.addEventListener('selectend', onSelectEnd);
                scene.add(controller1);

                controller2 = renderer.xr.getController(1);
                controller2.addEventListener('selectstart', onSelectStart);
                controller2.addEventListener('selectend', onSelectEnd);
                scene.add(controller2);

                const controllerModelFactory = new XRControllerModelFactory();

                controllerGrip1 = renderer.xr.getControllerGrip(0);
                controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
                scene.add(controllerGrip1);

                controllerGrip2 = renderer.xr.getControllerGrip(1);
                controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
                scene.add(controllerGrip2);

                const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 0, -1)
                ]);
                const line = new THREE.Line(lineGeometry);
                line.name = 'line';
                line.scale.z = 5;
                controller1.add(line.clone());
                controller2.add(line.clone());

                raycaster = new THREE.Raycaster();
                window.addEventListener('resize', onWindowResize);

                renderer.setAnimationLoop(render);
                log('[4] Todo listo. Toca el botÃ³n AR.');

            } catch (err) {
                log('[ERROR] ' + err.name + ': ' + err.message);
                console.error(err);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onSelectStart(event) {
            const controller = event.target;
            const intersections = getIntersections(controller);
            if (intersections.length > 0) {
                const object = intersections[0].object;
                object.material.uniforms.emissive.value = 1.0;
                controller.attach(object);
                controller.userData.selected = object;
            }
            controller.userData.targetRayMode = event.data.targetRayMode;
        }

        function onSelectEnd(event) {
            const controller = event.target;
            if (controller.userData.selected !== undefined) {
                const object = controller.userData.selected;
                object.material.uniforms.emissive.value = 0.0;
                group.attach(object);
                object.rotation.set(0, 0, 0);
                controller.userData.selected = undefined;
            }
        }

        function getIntersections(controller) {
            if (raycaster.setFromXRController) {
                raycaster.setFromXRController(controller);
                return raycaster.intersectObjects(group.children, false);
            }
            controller.updateMatrixWorld();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            return raycaster.intersectObjects(group.children, false);
        }

        function intersectObjects(controller) {
            if (controller.userData.targetRayMode === 'screen') return;
            if (controller.userData.selected !== undefined) return;
            const line = controller.getObjectByName('line');
            const intersections = getIntersections(controller);
            if (intersections.length > 0) {
                const object = intersections[0].object;
                object.material.uniforms.emissive.value = 1.0;
                intersected.push(object);
                line.scale.z = intersections[0].distance;
            } else {
                line.scale.z = 5;
            }
        }

        function cleanIntersected() {
            while (intersected.length) {
                const object = intersected.pop();
                if (controller1.userData.selected !== object && controller2.userData.selected !== object) {
                    object.material.uniforms.emissive.value = 0.0;
                }
            }
        }

        function render() {
            group.rotation.set(0, 0, 0);

            if (renderer.xr.hasDepthSensing() && !isDepthSupplied) {
                group.children.forEach(child => {
                    const depthTexture = renderer.xr.getDepthTexture();
                    child.material.uniforms.depthColor.value = depthTexture;
                    if (depthTexture && depthTexture.source && depthTexture.source.data) {
                        child.material.uniforms.depthWidth.value = depthTexture.source.data.width;
                        child.material.uniforms.depthHeight.value = depthTexture.source.data.height;
                    } else {
                        child.material.uniforms.depthWidth.value = 1680;
                        child.material.uniforms.depthHeight.value = 1760;
                    }
                });
                isDepthSupplied = true;
                log('[DEPTH] OclusiÃ³n activada');
            } else if (!renderer.xr.hasDepthSensing() && isDepthSupplied) {
                group.children.forEach(child => {
                    child.material.uniforms.depthWidth.value = 0;
                    child.material.uniforms.depthHeight.value = 0;
                });
                isDepthSupplied = false;
            }

            cleanIntersected();
            intersectObjects(controller1);
            intersectObjects(controller2);
            controls.update();
            renderer.render(scene, camera);
        }

    </script>
</body>
</html>
